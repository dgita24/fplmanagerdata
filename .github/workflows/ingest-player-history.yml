name: Ingest Player History

on:
  # Run at 02:30 UTC (≈ 02:30 UK winter / 03:30 UK summer) — off-peak
  schedule:
    - cron: '30 2 * * *'
  # Allow manual runs with optional inputs
  workflow_dispatch:
    inputs:
      mode:
        description: 'nightly (incremental) or backfill (GW range)'
        required: false
        default: 'nightly'
        type: choice
        options:
          - nightly
          - backfill
      start_gw:
        description: 'Start GW (backfill mode only, 1–38)'
        required: false
        default: ''
      end_gw:
        description: 'End GW (backfill mode only, 1–38)'
        required: false
        default: ''
      recent_gw_revalidate:
        description: 'Number of recent GWs to re-fetch even if cached (default: 2)'
        required: false
        default: '2'

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the snapshot back to data/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the latest HEAD so the pushed commit lands on the right branch
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ingest arguments
        id: args
        run: |
          MODE="${{ github.event.inputs.mode || 'nightly' }}"
          ARGS="--mode=${MODE} --outDir=./data --baseUrl=https://fantasy.premierleague.com/api"

          START_GW="${{ github.event.inputs.start_gw }}"
          END_GW="${{ github.event.inputs.end_gw }}"
          REVALIDATE="${{ github.event.inputs.recent_gw_revalidate || '2' }}"

          [ -n "$START_GW" ] && ARGS="$ARGS --startGw=$START_GW"
          [ -n "$END_GW"   ] && ARGS="$ARGS --endGw=$END_GW"
          ARGS="$ARGS --recentGwRevalidate=$REVALIDATE"

          echo "INGEST_ARGS=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Running: npx tsx src/tools/ingest-player-history.ts $ARGS"

      - name: Run ingest script
        run: npx tsx src/tools/ingest-player-history.ts ${{ steps.args.outputs.INGEST_ARGS }}

      - name: Upload snapshot as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-history-snapshot
          path: |
            data/player-history.ndjson
            data/player-history-meta.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated snapshot to data/ folder
        # Only commit when running on the default branch (not on forks or PRs)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player-history.ndjson data/player-history-meta.json 2>/dev/null || true
          # Only commit when there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to snapshot — skipping commit."
          else
            git commit -m "chore(data): update player history snapshot [skip ci]"
            git push
          fi
